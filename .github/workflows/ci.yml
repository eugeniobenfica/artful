name: CI

# What no single machine can check: each system and compiler, the shaders against spirv-val, and the
# Vulkan calls against the validation layers (on a software Vulkan, Mesa's lavapipe).
on: [push, pull_request]

# (a newer push makes the run before it worthless)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      # (lavapipe falls over, in the shader llvmpipe makes, wherever the trees are walked while the scene is drawn:
      # light that bounced gathered on the GPU, shadows and reflections from rays, and what tests them. Reproduced on
      # Windows with MSYS2's Mesa: not a read past a buffer (robustBufferAccess changes nothing), nor the stack of the
      # walk, nor textures; not yet found. Every other test runs here; these run on the GPUs of Windows' machine.)
      ARTFUL_SKIP: post/floats,tracing/probeReflections,scale/tracedSkinLod,tracing/traceHardware,backends/pipelinesAhead,tracing/tracedShadows,tracing/tracedReflections,tracing/tracedMoved,tracing/tracedRefit,tracing/probesGpu,tracing/probesKept
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: What the checks need (none of it is linked)
        run: sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan1 vulkan-validationlayers spirv-tools
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build
      - name: Tests, in every mode
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_VALIDATE_SYNC: 1
          VK_LAYER_SYNCVAL_SHADER_ACCESSES_HEURISTIC: 1
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: true
          VK_KHRONOS_VALIDATION_SYNCVAL_SHADER_ACCESSES_HEURISTIC: true
          ARTFUL_TEST_TRACE: 1
          ARTFUL_FLIP_LOG: flip-linux-${{ matrix.cc }}.csv
        run: |
          build/artful-tests
          ARTFUL_SINGLE_DRAW=1 build/artful-tests
          ARTFUL_FEATURES=+occlusion build/artful-tests
          ARTFUL_FEATURES=-lod,-cones build/artful-tests
      # (what FLIP measured of each comparison here, to set thresholds by it: docs/plano-de-correcao.md, 0.4)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip-linux-${{ matrix.cc }}
          path: flip-linux-${{ matrix.cc }}.csv
          if-no-files-found: ignore
      - name: Without Vulkan (what needs it is left out)
        run: |
          cmake -S . -B build-novulkan -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DARTFUL_VULKAN=OFF
          cmake --build build-novulkan
          build-novulkan/artful-tests
      - name: The shaders are valid SPIR-V
        run: |
          mkdir shaders && build/artful-shaders shaders
          for f in shaders/*.spv; do spirv-val --target-env vulkan1.2 "$f"; done
      - name: Memory
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-sanitize=float-cast-overflow"
          cmake --build build-asan --target artful-tests
          build-asan/artful-tests
          ARTFUL_FEATURES=+occlusion build-asan/artful-tests

  # The readers fuzzed (tools/fuzz), each for ten minutes from the seeds, under ASan and UBSan: what is found is kept
  # as an artifact, to be minimized and put in tests/files.c's fuzzFindings. Ten minutes is not the 24 hours each
  # target should run (docs/plano-de-correcao.md, 3.1); a push runs it again from the same seeds.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [gltf, image, hdr, ktx2, blocks, ies, cube, meshopt, cook]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DARTFUL_FUZZ=ON -DARTFUL_BUILD_TESTS=OFF -DARTFUL_VULKAN=OFF
          cmake --build build --target artful-fuzz-${{ matrix.target }}
      - name: Fuzz for ten minutes
        run: |
          python3 tools/fuzz/seeds.py seeds
          mkdir -p corpus findings
          dict=""; if [ "${{ matrix.target }}" = gltf ]; then dict="-dict=tools/fuzz/gltf.dict"; fi
          seeds="seeds/${{ matrix.target }}"; [ -d "$seeds" ] || seeds=""  # (cook starts from nothing: its first byte says which)
          build/artful-fuzz-${{ matrix.target }} corpus $seeds $dict -max_total_time=600 -max_len=65536 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=1024             -artifact_prefix=findings/ -print_final_stats=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: findings
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - env:
          ARTFUL_FLIP_LOG: flip-macos.csv
        run: |
          cmake -S . -B build -G Ninja -DARTFUL_METAL=ON
          cmake --build build
          build/artful-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip-macos
          path: flip-macos.csv
          if-no-files-found: ignore
      # (the Metal Artful writes itself, from the shaders' IR: src/shaderir/msl.c, what metal.c compiles as it starts.
      # Every shader it writes goes through Apple's compiler; what it cannot write yet, ray queries, it says, and leaves
      # out)
      - name: Metal from the IR, through Apple's compiler
        run: |
          mkdir ours
          build/artful-shaders ours --ir
          for f in ours/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /dev/null || exit 1; done
      # (Metal against the CPU, on this runner's GPU, where it has one: what backends/metal says, said again apart)
      - name: Metal, run
        run: |
          build/artful-tests backends/metal shaderIr
          system_profiler SPDisplaysDataType | head -20 || true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSVC
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          build/Release/artful-tests.exe

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version says the same everywhere
        run: |
          version=$(sed -n 's/^project(artful VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          header=$(sed -n 's/^#define ARTF_VERSION_[A-Z]* \([0-9]*\).*/\1/p' include/artful/core.h | paste -sd.)
          test "$version" = "$header"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Every ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cmake -S . -B build-$abi -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26
            cmake --build build-$abi
          done
